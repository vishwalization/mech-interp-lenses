# Copy this folder to experiments/expNNN_<name>/, edit, push to main → the GPU runner executes it.
name: expNNN_name
method: emergence_curve        # logit_lens | emergence_curve | diffusion_lens | j_lens | token_cards | layer_ablation
args: []                       # extra flags for the script, e.g. ["--stride", "2"]

# ---- standard lens config (same schema as configs/*.yaml) ----
concept_label: animal
fallback_word: animal
easy_count: 5
prompts:
  - "a dog over a white table"
  - "a cat over a white table"
  - "a bird over a white table"
  - "a fish over a white table"
  - "a rat over a white table"
  - "an axolotl over a white table"
  - "a quokka over a white table"
  - "a platypus over a white table"
  - "an okapi over a white table"
  - "a pangolin over a white table"
position: last
layer_stride: 3
topk: 5
prob_thresh: 0.05
rank_thresh: 50
generation:
  seed: 42
  height: 512
  width: 512
  num_inference_steps: 4
  guidance_scale: 1.0
